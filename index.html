<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" />
    <meta name="theme-color" content="#0B0B0B" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Syne:wght@400..800&display=swap" rel="stylesheet">

    <!-- ===================== SEO base =====================
         Estas etiquetas describen la home. SeoHead.jsx las reescribe al
         navegar, pero los scrapers de redes sociales no ejecutan JavaScript:
         lo que leen es exactamente lo que hay acá. Por eso el bloque está
         duplicado en estático y no solo en el componente. -->
    <title>Matías Gunsett | Front-End Developer · React.js</title>
    <meta
      name="description"
      content="Desarrollador Front-End especializado en React: interfaces y aplicaciones web a medida, rápidas y pensadas para el usuario final. Especialidad en landing pages para futbolistas profesionales."
    />
    <meta name="author" content="Matías Gunsett" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://matiasgunsett.netlify.app" />

    <!-- ===================== Open Graph ===================== -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SportFolio · Matías Gunsett" />
    <meta property="og:title" content="Matías Gunsett | Front-End Developer · React.js" />
    <meta
      property="og:description"
      content="Desarrollador Front-End especializado en React: interfaces y aplicaciones web a medida, rápidas y pensadas para el usuario final. Especialidad en landing pages para futbolistas profesionales."
    />
    <meta property="og:url" content="https://matiasgunsett.netlify.app" />
    <meta property="og:image" content="https://matiasgunsett.netlify.app/og-image.webp" />
    <meta property="og:image:width" content="1448" />
    <meta property="og:image:height" content="1086" />
    <meta property="og:image:alt" content="Portfolio de Matías Gunsett, desarrollador Front-End React" />
    <meta property="og:locale" content="es_AR" />

    <!-- ===================== Twitter Card ===================== -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Matías Gunsett | Front-End Developer · React.js" />
    <meta
      name="twitter:description"
      content="Desarrollador Front-End especializado en React: interfaces y aplicaciones web a medida, rápidas y pensadas para el usuario final. Especialidad en landing pages para futbolistas profesionales."
    />
    <meta name="twitter:image" content="https://matiasgunsett.netlify.app/og-image.webp" />
    <meta name="twitter:image:alt" content="Portfolio de Matías Gunsett, desarrollador Front-End React" />

    <!-- ===================== Datos estructurados =====================
         Copia estática del JSON-LD que arma SeoHead, para los rastreadores
         que indexan sin ejecutar JS. SeoHead reutiliza este mismo <script>
         (lo busca por selector) en vez de agregar un segundo. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Person",
          "name": "Matías Gunsett",
          "url": "https://matiasgunsett.netlify.app",
          "jobTitle": "Front-End Developer · React.js",
          "email": "mailto:matiasgunsett@gmail.com",
          "sameAs": [
            "https://www.instagram.com/mgunsett/",
            "https://www.threads.com/@mgunsett",
            "https://github.com/mgunsett",
            "https://linkedin.com/in/matiasgunsett"
          ]
        },
        {
          "@type": "ProfessionalService",
          "name": "SportFolio · Matías Gunsett",
          "description": "Desarrollador Front-End especializado en React: interfaces y aplicaciones web a medida, rápidas y pensadas para el usuario final.",
          "url": "https://matiasgunsett.netlify.app",
          "areaServed": "Argentina",
          "serviceType": "Landing Deportiva",
          "provider": { "@type": "Person", "name": "Matías Gunsett" }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
